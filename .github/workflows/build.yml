name: Build all platforms

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run common unit tests (Android)
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: financalc-android-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk

  desktop:
    name: Desktop (Linux JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run desktop tests (unit + UI + integration)
        run: ./gradlew :composeApp:desktopTest --stacktrace

      - name: Package distribution
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: financalc-desktop-linux
          path: |
            composeApp/build/compose/binaries/main/deb/*.deb
            composeApp/build/compose/jars/*.jar

  web:
    name: Web (Wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Wasm distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace

      - name: Disable Jekyll for Pages
        run: touch composeApp/build/dist/wasmJs/productionExecutable/.nojekyll

      - uses: actions/upload-artifact@v4
        with:
          name: financalc-web
          path: composeApp/build/dist/wasmJs/productionExecutable/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable/

  deploy-pages:
    name: Deploy Web to GitHub Pages
    needs: web
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  ios:
    name: iOS Simulator (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Link iOS Simulator (arm64) framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build .app for iOS Simulator
        working-directory: iosApp
        run: |
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -arch arm64 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Zip the .app bundle
        working-directory: iosApp/build/Build/Products/Debug-iphonesimulator
        run: zip -ry iosApp-simulator.zip iosApp.app

      - uses: actions/upload-artifact@v4
        with:
          name: financalc-ios-simulator-app
          path: iosApp/build/Build/Products/Debug-iphonesimulator/iosApp-simulator.zip
