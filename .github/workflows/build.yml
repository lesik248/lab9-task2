name: Build all platforms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-and-desktop:
    name: Android APK + Linux Desktop + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper jar
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      - name: Common & Desktop tests
        run: ./gradlew :composeApp:desktopTest --stacktrace

      - name: Android assemble
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Linux Desktop distributable (.deb)
        run: ./gradlew :composeApp:packageDeb --stacktrace
        continue-on-error: true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Linux .deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: composeApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: warn

  web:
    name: Web (wasmJs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Gradle wrapper jar
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin
      - name: Build Web distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace
      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: composeApp/build/dist/wasmJs/productionExecutable
          if-no-files-found: warn

  ios:
    name: iOS framework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Gradle wrapper jar
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin
      - name: Build iOS Simulator framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
